databases:
  # E-commerce PostgreSQL Database
  - name: ecommerce-db
    plan: free
    user: ecommerce_user

  # BillBook PostgreSQL Database
  - name: billbook-db
    plan: free
    user: billbook_user

services:
  # Backend - E-commerce API
  - type: web
    name: ecommerce-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ecommerce-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ecommerce-db
          property: password
      - key: PORT
        value: 8080
      - key: APP_BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # BillBook Backend
  - type: web
    name: billbook-backend
    runtime: docker
    dockerfilePath: ./billbook-backend/Dockerfile
    dockerContext: ./billbook-backend
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: billbook-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: billbook-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: billbook-db
          property: password
      - key: PORT
        value: 9999
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # AdminWeb - React Frontend
  - type: web
    name: admin-web
    runtime: node
    buildCommand: cd AdminWeb && npm install && npm run build
    startCommand: cd AdminWeb && npx serve -s dist -l 3000
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false

  # BillBook Frontend
  - type: web
    name: billbook-frontend
    runtime: node
    buildCommand: cd BillBook/frontend && npm install && npm run build
    startCommand: cd BillBook/frontend && npx serve -s dist -l 3001
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
