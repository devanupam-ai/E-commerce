spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/billbook}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:manager}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

jwt.secret=${JWT_SECRET:billbook_jwt_secret_key_2024_very_long_secure_string_xyz}
jwt.expiration=86400000

server.port=${PORT:9999}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# File Upload Config
app.upload.dir=uploads/scans
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Multipart config for photo invoice
spring.servlet.multipart.enabled=true
