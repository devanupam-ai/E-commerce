#spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

jwt.secret=ecommerce_jwt_secret_key_2024_very_long_secure_string
jwt.expiration=86400000

firebase.config.path=classpath:firebase-service-account.json

server.port=8080

# File upload config
app.upload.dir=uploads/products/
app.base.url=http://localhost:8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Serve uploaded images
spring.web.resources.static-locations=classpath:/,file:uploads/

razorpay.key.id=rzp_test_XXXXXXXXXXXXXXXX
razorpay.key.secret=XXXXXXXXXXXXXXXXXXXXXXXX
spring.sql.init.mode=always
spring.sql.init.defer-datasource-initialization=true
